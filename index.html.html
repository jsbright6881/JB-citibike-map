const map=L.map('map',{center:[40.73,-74.0],zoom:13,zoomControl:true,attributionControl:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
map.zoomControl.setPosition('bottomright');

function gs(c){
  if(c>=50)return{color:'#6b0000',weight:5,opacity:0.92};
  if(c>=11)return{color:'#b5221a',weight:3.5,opacity:0.78};
  if(c>=3)return{color:'#d4722a',weight:2,opacity:0.55};
  return{color:'#d9943e',weight:1.2,opacity:0.35};
}

function norm(n){return n.toLowerCase().replace(/\s+/g,' ').replace(/\t/g,' ').trim();}
function findS(name,sm){
  if(sm[name])return sm[name];
  const n=norm(name);
  for(const[k,v]of Object.entries(sm)){if(norm(k)===n)return v;}
  const sh=name.split(',')[0].split('(')[0].trim();
  if(sm[sh])return sm[sh];
  let best=null,bs=0;const nw=new Set(n.split(/\W+/));
  for(const k of Object.keys(sm)){const kw=new Set(norm(k).split(/\W+/));let m=0;for(const w of nw){if(kw.has(w)&&w.length>1)m++;}const s=m/Math.max(nw.size,kw.size);if(s>bs&&s>0.5){bs=s;best=k;}}
  return best?sm[best]:null;
}

async function fr(s,e){
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/cycling/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson`);
  if(!r.ok)return null;const d=await r.json();
  if(d.code==='Ok'&&d.routes.length)return d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){}return null;
}

async function main(){
  const sE=document.getElementById('status'),pB=document.getElementById('progress-bar'),
    rC=document.getElementById('route-count'),sC=document.getElementById('station-count');
  let sm=null;
  for(const url of['https://gbfs.citibikenyc.com/gbfs/en/station_information.json','https://gbfs.lyft.com/gbfs/2.3/bkn/en/station_information.json']){
    try{const res=await fetch(url);const data=await res.json();sm={};
    for(const s of data.data.stations)sm[s.name]=[s.lat,s.lon];
    sE.textContent=Object.keys(sm).length+' stations loaded';break;}catch(e){continue;}
  }
  if(!sm){sE.textContent='Open this file directly in your browser.';return;}

  const resolved=[],ms=new Set();
  for(const r of R){const sc=findS(r.s,sm),ec=findS(r.e,sm);
    if(sc&&ec){resolved.push({...r,sc,ec});ms.add(r.s);ms.add(r.e);}}
  sC.textContent=ms.size;
  resolved.sort((a,b)=>a.c-b.c);

  const straight=resolved.filter(r=>r.c<11);
  const routed=resolved.filter(r=>r.c>=11);
  let drawn=0;const total=resolved.length;

  for(const r of straight){const st=gs(r.c);
    L.polyline([r.sc,r.ec],{color:st.color,weight:st.weight,opacity:st.opacity,smoothFactor:1}).addTo(map);drawn++;}
  rC.textContent=drawn;pB.style.width=(drawn/total*100)+'%';
  sE.textContent='Routing '+routed.length+' top paths…';

  const BATCH=12;
  for(let i=0;i<routed.length;i+=BATCH){
    const batch=routed.slice(i,i+BATCH);
    const results=await Promise.all(batch.map(r=>fr(r.sc,r.ec)));
    for(let j=0;j<batch.length;j++){
      const r=batch[j],st=gs(r.c),coords=results[j];
      L.polyline(coords&&coords.length>1?coords:[r.sc,r.ec],{color:st.color,weight:st.weight,opacity:st.opacity,smoothFactor:1}).addTo(map);
      drawn++;
    }
    rC.textContent=drawn;pB.style.width=(drawn/total*100)+'%';
  }

  pB.style.width='100%';
  setTimeout(()=>{pB.style.opacity='0';pB.style.transition='opacity 1s';},1000);
  sE.textContent='Complete';
  setTimeout(()=>{sE.style.opacity='0';sE.style.transition='opacity 2s';},3000);
}
main();
